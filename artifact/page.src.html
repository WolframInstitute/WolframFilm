<title>In[1]:= Director’s Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;1,400&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0E0F11; --panel: #16181C; --panel2: #1D2025; --line: #2A2D33;
    --bone: #EDE9E0; --muted: #8E9098; --red: #DD1100; --red-soft: #FF5A3C; --code: #0A0B0D;
    --sans: "Source Sans 3", "Noto Sans JP", "Segoe UI", system-ui, -apple-system, sans-serif;
    --serif: "Source Serif 4", "Noto Serif JP", Georgia, "Times New Roman", serif;
    --mono: "Source Code Pro", ui-monospace, Menlo, Consolas, "Noto Sans JP", monospace;
  }
  html, body { height: 100%; }
  body { background: var(--ink); color: var(--bone); font: 15px/1.5 var(--sans); padding-inline: 16px; }
  .wrap { max-width: 1680px; margin: 0 auto; padding-block: 18px 28px; display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 22px; align-items: start; }
  header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  header.top h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  header.top h1 b { color: var(--red); font-family: var(--mono); font-weight: 600; }
  header.top p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; min-width: 240px; }
  .langs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--panel); }
  .langs button { all: unset; cursor: pointer; font: 600 13px var(--sans); color: var(--muted); padding: 4px 12px; border-radius: 999px; }
  .langs button:hover { color: var(--bone); }
  .langs button[aria-pressed="true"] { background: var(--red); color: #fff; }
  .langs button:focus-visible { outline: 2px solid var(--bone); outline-offset: 1px; }
  :lang(ja) .chap .notes p { line-height: 1.75; }
  .stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 12px; }
  video { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; display: block; }
  .now { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; min-height: 26px; }
  .now .t { font: 600 14px var(--mono); color: var(--red-soft); font-variant-numeric: tabular-nums; }
  .now .title { font-weight: 700; font-size: 17px; }
  .now .era { color: var(--muted); font-size: 14px; }
  .strip { position: relative; display: flex; height: 30px; border-radius: 4px; overflow: hidden; background: var(--panel); }
  .strip button { all: unset; cursor: pointer; flex-grow: 1; flex-basis: 0; border-right: 1px solid var(--ink); background: var(--panel2); position: relative; }
  .strip button:hover, .strip button:focus-visible { background: #2B2F36; }
  .strip button.on { background: #3A1A14; }
  .strip button:focus-visible { outline: 2px solid var(--bone); outline-offset: -2px; }
  .strip .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--red); pointer-events: none; }
  .mp4 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 14.5px; }
  .mp4 a { color: #4DA3FF; font: 600 14.5px var(--mono); text-decoration: underline; text-underline-offset: 3px; word-break: break-all; }
  .mp4 a:hover, .mp4 a:focus-visible { color: #8CC4FF; }
  .mp4 span { color: var(--muted); }
  .legend { color: var(--muted); font-size: 13px; }
  .player-note { color: var(--muted); font-size: 13px; }
  aside { max-height: calc(100vh - 36px); overflow-y: auto; border-left: 1px solid var(--line); padding-left: 18px; scroll-behavior: smooth; }
  .chap { padding-block: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .chap.on { }
  .chap .hd { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline; cursor: pointer; }
  .chap .hd .t { font: 600 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .chap.on .hd .t { color: var(--red-soft); }
  .chap .hd h2 { margin: 0; font-size: 17px; line-height: 1.25; text-wrap: balance; }
  .chap.on .hd h2::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 8px; vertical-align: 2px; }
  .chap .era { grid-column: 2; color: var(--muted); font-size: 13px; }
  .chap .notes { display: grid; gap: 8px; }
  .chap .notes p { margin: 0; font: 15.5px/1.55 var(--serif); color: #DAD6CD; max-width: 62ch; }
  .chap .cap { margin: 0; color: var(--muted); font-size: 13px; }
  .chap .cap q { font-style: italic; }
  .snip { background: var(--code); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .snip .bar { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .snip .bar .lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snip button { font: 600 12px var(--sans); color: var(--bone); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  .snip button:hover { border-color: #4A4F57; }
  .snip button:focus-visible { outline: 2px solid var(--bone); outline-offset: 1px; }
  .snip pre { margin: 0; padding: 9px 10px; overflow-x: auto; font: 13px/1.5 var(--mono); color: #E8E4DA; white-space: pre-wrap; word-break: break-word; }
  .snip pre .sy { color: #FFFFFF; font-weight: 600; }
  .snip pre .st { color: #A9B4C2; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips a { font: 12.5px var(--mono); color: var(--bone); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; background: var(--panel); }
  .chips a:hover, .chips a:focus-visible { border-color: var(--red-soft); color: #fff; }
  .src { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13.5px; }
  .src a { color: #C9C5BC; text-underline-offset: 3px; text-decoration-color: #4A4F57; }
  .src a:hover { color: #fff; text-decoration-color: var(--red-soft); }
  .lbl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  footer { grid-column: 1 / -1; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
  footer a { color: #C9C5BC; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); background: var(--bone); color: var(--ink); font-weight: 600; padding: 7px 14px; border-radius: 6px; font-size: 13px; }
  @media (max-width: 1000px) {
    .wrap { grid-template-columns: minmax(0, 1fr); }
    .stage { position: static; }
    aside { max-height: none; overflow: visible; border-left: 0; padding-left: 0; border-top: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) { aside { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <header class="top">
    <h1><b>In[1]:=</b> <span id="h1t"></span></h1>
    <p id="sub"></p>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en" lang="en">English</button>
      <button type="button" data-lang="ru" lang="ru">Русский</button>
      <button type="button" data-lang="ja" lang="ja">日本語</button>
    </div>
  </header>

  <section class="stage" aria-label="Film">
    <video id="film" controls playsinline preload="auto"></video>
    <div class="now" aria-live="polite"><span class="t" id="nowT">0:00</span><span class="title" id="nowTitle"></span><span class="era" id="nowEra"></span></div>
    <div class="strip" id="strip" role="list" aria-label="Chapters"><div class="head" id="head"></div></div>
    <div class="mp4"><span id="mp4lead"></span><a id="mp4" href="#" target="_blank" rel="noopener"></a></div>
    <div class="legend" id="legend"></div>
    <div class="player-note" id="pnote" hidden></div>
  </section>

  <aside id="side" aria-label="Director’s commentary"></aside>

  <footer><span id="made"></span></footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
  const ALL = JSON.parse(document.getElementById('data').textContent); // { en, ru, ja }
  const UI = {
    en: {
      h1: 'the life of a language',
      sub: 'Director’s cut · the Wolfram Language, 1988–2026 · 2:48 · every snippet runs as-is in Wolfram Language 15.0',
      mp4: 'Published MP4, deployed with <code>CopyFile[…, CloudObject[…, Permissions -> "Public"]]</code>:',
      legend: 'Chapters: click to jump. Snippets in the sidebar: <strong>Copy</strong> copies the code, the time button jumps the film there.',
      made: 'Made in code: every frame drawn by a TypeScript renderer, every window output computed by the Wolfram Language 15.0 kernel, the score synthesized from a symbolic score.',
      onScreen: 'On screen:', docs: 'Documentation', sources: 'Sources', copy: 'Copy', copied: 'Copied', selected: 'Selected: press ⌘C', jump: 'Jump to',
      fallback: 'This browser can’t stream the segments, so the film plays from the Wolfram Cloud MP4; jumping ahead waits for it to download.',
      chapters: 'Chapters', commentary: 'Director’s commentary',
    },
    ru: {
      h1: 'жизнь языка',
      sub: 'Режиссёрская версия · язык Wolfram, 1988–2026 · 2:48 · каждый фрагмент кода запускается как есть в Wolfram Language 15.0',
      mp4: 'Опубликованный MP4, развёрнутый через <code>CopyFile[…, CloudObject[…, Permissions -> "Public"]]</code>:',
      legend: 'Главы: щёлкните, чтобы перейти. Фрагменты в боковой панели: <strong>Копировать</strong> копирует код, кнопка со временем переводит фильм к этому месту.',
      made: 'Сделано кодом: каждый кадр нарисован рендерером на TypeScript, каждый результат в окнах вычислен ядром Wolfram Language 15.0, музыка синтезирована из символьной партитуры.',
      onScreen: 'На экране:', docs: 'Документация', sources: 'Источники', copy: 'Копировать', copied: 'Скопировано', selected: 'Выделено: нажмите ⌘C', jump: 'Перейти к',
      fallback: 'Этот браузер не умеет потоково воспроизводить сегменты, поэтому фильм идёт из MP4 в Wolfram Cloud; переход вперёд ждёт загрузки.',
      chapters: 'Главы', commentary: 'Комментарий режиссёра',
    },
    ja: {
      h1: 'ある言語の一生',
      sub: 'ディレクターズカット · Wolfram言語 1988–2026 · 2:48 · コードはすべてWolfram言語15.0でそのまま実行できる',
      mp4: '公開したMP4(<code>CopyFile[…, CloudObject[…, Permissions -> "Public"]]</code>でデプロイ):',
      legend: 'チャプター:クリックで移動。サイドバーのコード:<strong>コピー</strong>でコードをコピー、時刻ボタンでその場面へ移動。',
      made: 'すべてコードで作成:フレームはTypeScriptのレンダラーが描き、ウィンドウ内の出力はWolfram言語15.0のカーネルが計算し、音楽は記号的な楽譜から合成した。',
      onScreen: '画面の字幕:', docs: 'ドキュメント', sources: '出典', copy: 'コピー', copied: 'コピーしました', selected: '選択しました:⌘Cを押してください', jump: '移動:',
      fallback: 'このブラウザはセグメント再生に対応していないため、Wolfram CloudのMP4から再生します。先へ移動するとダウンロードを待ちます。',
      chapters: 'チャプター', commentary: 'ディレクターズ・コメンタリー',
    },
  };
  const SEG = 4, NSEG = 42, CODECS = 'video/mp4; codecs="avc1.640032, mp4a.40.2"';
  const BASE = { en: 'video/', ru: 'video/ru/', ja: 'video/ja/' };
  const v = document.getElementById('film');
  const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let lang = 'en', DATA = ALL.en, T = UI.en;

  // ---------------------------------------------------------------- player: fragmented MP4 through Media Source
  let stopPlayer = () => {};
  function startMSE(base) {
    const ms = new MediaSource(), url = URL.createObjectURL(ms);
    v.src = url;
    const have = new Set(); let sb, busy = false, dead = false;
    const idle = () => (sb.updating ? new Promise((r) => sb.addEventListener('updateend', r, { once: true })) : Promise.resolve());
    const get = async (p) => new Uint8Array(await (await fetch(p)).arrayBuffer());
    const add = async (buf) => { if (dead) return; await idle(); sb.appendBuffer(buf); await idle(); };
    async function pump() {
      if (busy || !sb || dead) return; busy = true;
      try {
        for (;;) {
          let i = Math.min(NSEG - 1, Math.floor(v.currentTime / SEG));
          while (i < NSEG && have.has(i)) i++;
          if (i >= NSEG || i * SEG > v.currentTime + 24 || dead) break;
          await add(await get(`${base}seg${String(i).padStart(3, '0')}.mp4`));
          have.add(i);
        }
        if (have.size === NSEG && ms.readyState === 'open') { await idle(); ms.endOfStream(); }
      } catch (e) { if (!dead) console.error(e); }
      busy = false;
    }
    ms.addEventListener('sourceopen', async () => {
      ms.duration = NSEG * SEG;
      sb = ms.addSourceBuffer(CODECS);
      await add(await get(`${base}init.mp4`));
      pump();
    }, { once: true });
    v.addEventListener('timeupdate', pump);
    v.addEventListener('seeking', pump);
    const iv = setInterval(pump, 1500);
    return () => { dead = true; clearInterval(iv); v.removeEventListener('timeupdate', pump); v.removeEventListener('seeking', pump); URL.revokeObjectURL(url); };
  }
  const MSE = !!(window.MediaSource && MediaSource.isTypeSupported(CODECS));
  function loadFilm(t, playing) {
    stopPlayer();
    v.poster = `${BASE[lang]}poster.jpg`;
    const n = document.getElementById('pnote');
    if (MSE) { stopPlayer = startMSE(BASE[lang]); n.hidden = true; }
    else { stopPlayer = () => {}; v.src = DATA.mp4; n.hidden = false; n.textContent = T.fallback; }
    if (t > 0 || playing) v.addEventListener('loadedmetadata', () => { if (t > 0) v.currentTime = t; if (playing) v.play().catch(() => {}); }, { once: true });
  }
  const seek = (t) => { v.currentTime = t; v.play().catch(() => {}); };

  // ---------------------------------------------------------------- chapters strip + sidebar, rebuilt per language
  const strip = document.getElementById('strip'), head = document.getElementById('head'), side = document.getElementById('side');
  const hl = (code) => esc(code)
    .replace(/(&quot;[^&]*?&quot;)/g, '<span class="st">$1</span>')
    .replace(/\b(\$?[A-Z][A-Za-z0-9]*)(?=\[)/g, '<span class="sy">$1</span>');
  function build() {
    strip.querySelectorAll('button').forEach((b) => b.remove());
    side.replaceChildren();
    strip.setAttribute('aria-label', T.chapters); side.setAttribute('aria-label', T.commentary);
    for (const s of DATA.sections) {
      const b = document.createElement('button');
      b.style.flexGrow = String(s.t1 - s.t0);
      b.title = `${fmt(s.t0)} · ${s.title}`;
      b.setAttribute('aria-label', `${s.title}, ${fmt(s.t0)}`);
      b.setAttribute('role', 'listitem');
      b.addEventListener('click', () => seek(s.t0 + 0.01));
      s.stripEl = b; strip.insertBefore(b, head);
      const el = document.createElement('section');
      el.className = 'chap'; el.id = `c-${s.key}`;
      const notes = s.notes.map((p) => `<p>${esc(p)}</p>`).join('');
      const caps = s.captions.length ? `<p class="cap">${T.onScreen} ${s.captions.map((c) => `<q>${esc(c)}</q>`).join(' ')}</p>` : '';
      const snips = s.snippets.map((sn, k) => `
        <div class="snip"><div class="bar"><span class="lab">${esc(sn.label)}</span>
          <button type="button" data-t="${sn.t}" aria-label="${T.jump} ${fmt(sn.t)}">${fmt(sn.t)}</button>
          <button type="button" data-copy="${s.key}:${k}">${T.copy}</button></div>
          <pre lang="en">${hl(sn.code)}</pre></div>`).join('');
      const docs = s.docs.length ? `<div class="lbl">${T.docs}</div><div class="chips">${s.docs.map((d) => `<a href="${d.url}" target="_blank" rel="noopener" lang="en">${esc(d.name)}</a>`).join('')}</div>` : '';
      const srcs = s.sources.length ? `<div class="lbl">${T.sources}</div><ul class="src">${s.sources.map((r) => `<li><a href="${r.url}" target="_blank" rel="noopener">${esc(r.label)}</a></li>`).join('')}</ul>` : '';
      el.innerHTML = `<div class="hd" data-t="${s.t0}"><span class="t">${fmt(s.t0)}</span><h2>${esc(s.title)}</h2>${s.era ? `<span class="era">${esc(s.era)}</span>` : ''}</div>
        <div class="notes">${notes}</div>${caps}${snips}${docs}${srcs}`;
      s.el = el; side.appendChild(el);
    }
    current = null; sync();
  }
  function setLang(l, first = false) {
    if (!ALL[l]) l = 'en';
    const t = first ? 0 : v.currentTime, playing = !first && !v.paused;
    lang = l; DATA = ALL[l]; T = UI[l];
    document.documentElement.lang = l;
    document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
    document.getElementById('sub').textContent = T.sub;
    document.getElementById('h1t').textContent = T.h1;
    document.getElementById('mp4lead').innerHTML = T.mp4;
    const a = document.getElementById('mp4'); a.href = a.textContent = DATA.mp4;
    document.getElementById('legend').innerHTML = T.legend;
    document.getElementById('made').textContent = T.made;
    build();
    loadFilm(t, playing);
    try { localStorage.setItem('lang', l); } catch {}
    if (!first) history.replaceState(null, '', l === 'en' ? location.pathname + location.search : `#${l}`);
  }
  document.querySelector('.langs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && b.dataset.lang !== lang) setLang(b.dataset.lang); });

  const toast = (msg) => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1400); };
  side.addEventListener('click', async (e) => {
    const b = e.target.closest('button, .hd');
    if (!b) return;
    if (b.dataset.t) { seek(+b.dataset.t + 0.01); return; }
    if (b.dataset.copy) {
      const [key, k] = b.dataset.copy.split(':');
      const code = DATA.sections.find((s) => s.key === key).snippets[+k].code;
      try { await navigator.clipboard.writeText(code); toast(T.copied); }
      catch { const r = document.createRange(); r.selectNodeContents(b.closest('.snip').querySelector('pre')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast(T.selected); }
    }
  });

  // ---------------------------------------------------------------- follow the playhead
  let userScrolled = 0, current = null;
  side.addEventListener('wheel', () => (userScrolled = Date.now()), { passive: true });
  side.addEventListener('touchmove', () => (userScrolled = Date.now()), { passive: true });
  const nowT = document.getElementById('nowT'), nowTitle = document.getElementById('nowTitle'), nowEra = document.getElementById('nowEra');
  function sync() {
    const t = v.currentTime;
    head.style.left = `calc(${(t / DATA.duration) * 100}% - 1px)`;
    nowT.textContent = fmt(t);
    const s = DATA.sections.find((s) => t >= s.t0 && t < s.t1) ?? DATA.sections[DATA.sections.length - 1];
    if (s !== current) {
      if (current) { current.el.classList.remove('on'); current.stripEl.classList.remove('on'); }
      current = s; s.el.classList.add('on'); s.stripEl.classList.add('on');
      nowTitle.textContent = s.title; nowEra.textContent = s.era;
      if (Date.now() - userScrolled > 6000 && getComputedStyle(side).overflowY === 'auto') side.scrollTop = s.el.offsetTop - side.offsetTop - 8;
    }
  }
  v.addEventListener('timeupdate', sync);
  v.addEventListener('seeked', sync);

  let saved = null; try { saved = localStorage.getItem('lang'); } catch {}
  const fromHash = location.hash.slice(1);
  setLang(ALL[fromHash] ? fromHash : saved ?? (/^(ru|ja)/.exec(navigator.language)?.[1] ?? 'en'), true);
})();
</script>
